services:
  api:
    build: .
    image: scholarflow-backend:local
    env_file: .env
    environment:
      SCHOLARFLOW_DATA_DIR: /usr/src/app/data/scholarflow
    volumes:
      - scholarflow-data:/usr/src/app/data/scholarflow
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
  worker:
    build: .
    image: scholarflow-backend:local
    command: ["python", "-m", "backend.scholarflow.worker"]
    env_file: .env
    environment:
      SCHOLARFLOW_DATA_DIR: /usr/src/app/data/scholarflow
    volumes:
      - scholarflow-data:/usr/src/app/data/scholarflow
    depends_on: [api]
    restart: unless-stopped
  web:
    build: frontend/nextjs
    environment:
      SCHOLARFLOW_API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [api]
    restart: unless-stopped
volumes:
  scholarflow-data:
